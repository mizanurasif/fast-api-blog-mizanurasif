[project]
name = "fastapi-blog"
version = "0.1.0"
description = "A blog built with FastAPI, SQLAlchemy (async) and Jinja2 templates"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlalchemy>=2.0.52",
    "aiosqlite>=0.22.1",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pillow>=12.3.0",
    "aiosmtplib>=5.1.3",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.0",
    "boto3>=1.43.98",
]

[dependency-groups]
dev = [
    "moto[s3]>=5.2.3",
    "pytest>=9.1.1",
]
